<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0f172a"/>
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff5252"/>
      <stop offset="100%" style="stop-color:#b71c1c"/>
    </linearGradient>
  </defs>
  <!-- Speed line -->
  <line x1="4" y1="25" x2="18" y2="25" stroke="#e53935" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="6" y1="30" x2="16" y2="30" stroke="#e53935" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Car body -->
  <path d="M 14 34 L 17 26 Q 26 18 36 17 Q 46 16 52 20 L 56 26 L 57 34 Z" fill="url(#fg)"/>
  <!-- Roof -->
  <path d="M 19 25 Q 28 18 37 17 Q 46 16 52 20 L 50 25 Q 40 19 28 21 Z" fill="#c62828"/>
  <!-- Windshield -->
  <path d="M 28 21 Q 36 17 44 17 L 50 25 Q 40 19 28 21 Z" fill="rgba(255,255,255,0.18)"/>
  <!-- Under skirt -->
  <path d="M 14 34 L 57 34 L 55 39 Q 44 42 36 42 Q 24 42 16 39 Z" fill="#b71c1c"/>
  <!-- Front wheel -->
  <circle cx="24" cy="40" r="8" fill="#1a1a1a"/>
  <circle cx="24" cy="40" r="5" fill="#2a2a2a"/>
  <circle cx="24" cy="40" r="2" fill="#777"/>
  <!-- Rear wheel -->
  <circle cx="48" cy="40" r="8" fill="#1a1a1a"/>
  <circle cx="48" cy="40" r="5" fill="#2a2a2a"/>
  <circle cx="48" cy="40" r="2" fill="#777"/>
  <!-- Headlight -->
  <path d="M 54 24 L 60 28 L 58 34 L 54 33 Z" fill="#ffeb3b" opacity="0.85"/>
  <!-- "E" initial under car -->
  <text x="32" y="58" text-anchor="middle" font-family="'Poppins',sans-serif" font-weight="900" font-size="10" fill="#e53935" letter-spacing="2">ERC</text>
</svg>
